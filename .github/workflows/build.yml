name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DinamikAda.apk
          gh release create "v3.${{ github.run_number }}" DinamikAda.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Dinamik Ada v3.${{ github.run_number }}" \
            --notes "Huawei P40 Lite icin Dinamik Ada APK"
